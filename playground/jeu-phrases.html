let hits = 0;
let misses = 0;
let round = null;
let lock = false;

let voices = [];
let ready = false;

const hitsEl = document.getElementById("hits");
const missesEl = document.getElementById("misses");
const grid = document.getElementById("grid");

function shuffle(a){
  return [...a].sort(()=>Math.random()-0.5);
}

// 🔊 LOAD VOICES PROPERLY
function loadVoices(){
  voices = speechSynthesis.getVoices();
  if(voices.length > 0){
    ready = true;
    console.log("Voices ready:", voices.length);
  }
}

// important pour mobile
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

// 🔊 SPEAK ROBUST
function speak(word){
  if(!ready){
    console.log("Voices not ready yet");
    return;
  }

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(word);

  // force FR si possible
  const frVoice = voices.find(v => v.lang.startsWith("fr"));
  if(frVoice) utter.voice = frVoice;

  utter.lang = "fr-FR";
  utter.rate = 0.9;

  speechSynthesis.speak(utter);
}

function nextRound(){
  lock = false;

  const target = words[Math.floor(Math.random()*words.length)];
  const choices = shuffle(
    [target, ...shuffle(words.filter(w=>w!==target)).slice(0,3)]
  );

  round = {target, choices};

  render();

  setTimeout(()=>speak(target),1000);
}

function render(){
  grid.innerHTML = "";

  round.choices.forEach(w=>{
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = w;

    b.onclick = ()=>{
      if(lock) return;

      if(w === round.target){
        lock = true;
        hits++;
        hitsEl.textContent = hits;

        b.classList.add("good");
        speak(w);

        setTimeout(nextRound,800);

      } else {
        misses++;
        missesEl.textContent = misses;

        b.classList.add("bad");
        speak(w);

        setTimeout(()=>b.classList.remove("bad"),300);
      }
    };

    grid.appendChild(b);
  });
}

// 👉 IMPORTANT : premier click débloque audio
document.getElementById("start").onclick = ()=>{
  speechSynthesis.resume(); // 🔥 critical fix
  nextRound();
};

document.getElementById("repeat").onclick = ()=>{
  speechSynthesis.resume();
  if(round) speak(round.target);
};
