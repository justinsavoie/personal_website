<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeu des mots</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#f0f2f5;
}

.app{
  width:100%;
  max-width:420px;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.top{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:18px;
}

.main{
  background:white;
  padding:12px;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.prompt{
  text-align:center;
  font-size:26px;
  font-weight:900;
}

.controls{
  display:flex;
  gap:6px;
}

button{
  flex:1;
  padding:12px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:#222;   /* contraste élevé */
  color:white;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.choice{
  padding:18px;
  font-size:22px;
  font-weight:900;
  border-radius:12px;
  background:#ffffff;
  border:2px solid #000; /* contraste fort */
  color:#000;
}

.good{
  background:#00c853;
  color:white;
  border-color:#00c853;
}

.bad{
  background:#d50000;
  color:white;
  border-color:#d50000;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div>✅ <span id="hits">0</span></div>
    <div>❌ <span id="misses">0</span></div>
  </div>

  <div class="main">
    <div class="prompt">Écoute</div>

    <div class="controls">
      <button id="start">Jouer</button>
      <button id="repeat">🔊</button>
    </div>

    <div id="grid" class="grid"></div>
  </div>

</div>

<script>

const words = [
"chat","chien","pomme","banane","voiture","ballon","soleil","lune","fleur","poisson","oiseau","ours","bébé","train","bateau","maison","lait","gâteau",

"table","chaise","porte","fenêtre","lit","lampe","stylo","cahier","livre","sac","clé","montre","écran","téléphone","ordinateur",

"eau","pain","fromage","beurre","sucre","sel","riz","pâtes","viande","poire","fraise","orange","raisin","carotte","tomate","salade",

"tasse","verre","assiette","fourchette","cuillère","couteau","bol","cuisine","repas","déjeuner","dîner",

"papa","maman","frère","sœur","ami","copain","voisin","enfant","famille","professeur","élève",

"école","classe","récré","devoir","examen","question","réponse","lecture","écriture","calcul",

"route","rue","pont","ville","village","parc","forêt","plage","montagne","rivière","lac","mer",

"avion","bus","métro","taxi","vélo","camion","moto",

"rouge","bleu","vert","jaune","noir","blanc","gris","rose","violet",

"grand","petit","gros","mince","long","court","rapide","lent","chaud","froid","fort","faible",

"main","pied","tête","bras","jambe","œil","nez","bouche","oreille","dos",

"courir","marcher","sauter","manger","boire","dormir","parler","écouter","regarder","penser","jouer",

"heure","minute","seconde","jour","nuit","matin","soir","semaine","mois","année",

"pluie","neige","vent","orage","nuage","ciel",

"mur","toit","sol","jardin","garage","escalier",

"argent","prix","achat","vente","magasin","client","ticket","carte",

"musique","chanson","danse","film","image","photo","dessin","art",

"jeu","score","point","niveau","erreur","réussite","choix",

"lapin","cheval","vache","mouton","cochon","poule","canard","souris","renard","loup","lion","tigre","zèbre","girafe","éléphant","singe","serpent","tortue","grenouille","papillon","abeille","fourmi","araignée","baleine","dauphin","requin","hibou","écureuil","hérisson","chèvre",

"arbre","feuille","branche","herbe","pierre","sable","colline","île","océan","vague","étoile","planète","terre","volcan","désert","grotte","champ","prairie","ruisseau","cascade","champignon","racine","graine","écorce","nid",

"céréales","confiture","miel","chocolat","bonbon","biscuit","crêpe","soupe","œuf","jambon","poulet","saucisse","pizza","sandwich","yaourt","glace","citron","cerise","pêche","ananas","melon","brocoli","haricot","oignon","concombre",

"salon","chambre","bureau","couloir","grenier","cave","plafond","balcon","fauteuil","canapé","tapis","rideau","miroir","armoire","tiroir","étagère","coussin","oreiller","couverture","drap","baignoire","douche","lavabo","savon","serviette",

"chemise","pantalon","robe","jupe","manteau","veste","pull","chaussette","chaussure","botte","chapeau","casquette","écharpe","gant","bonnet","pyjama","ceinture","lunettes","poche","bouton",

"crayon","gomme","règle","ciseaux","colle","cartable","tableau","craie","feutre","trousse","page","lettre","mot","phrase","histoire","nombre","chiffre","addition","leçon","dictée",

"cheveux","visage","joue","menton","dent","langue","cou","épaule","coude","genou","doigt","ongle","ventre","cœur","peau",

"pompier","policier","médecin","infirmière","boulanger","fermier","facteur","pilote","cuisinier","dentiste","vétérinaire","grand-père","grand-mère","oncle","tante","cousin","cousine","chanteur","artiste","roi","reine","prince","princesse",

"hélicoptère","fusée","tracteur","ambulance","sous-marin","trottinette","voilier","gare","aéroport","port","hôpital","bibliothèque","boulangerie","pharmacie","église","musée","piscine","stade","marché","restaurant",

"heureux","triste","content","fâché","gentil","méchant","joli","beau","laid","jeune","vieux","nouveau","propre","sale","doux","dur","léger","lourd","facile","difficile","plein","vide","haut","bas","large","étroit","mouillé","sec","calme","bruyant","sucré","salé","brillant","sombre","drôle",

"chanter","danser","lire","écrire","dessiner","compter","nager","grimper","lancer","attraper","pousser","tirer","ouvrir","fermer","laver","cuisiner","construire","chercher","trouver","cacher","gagner","perdre","aider","partager","oublier","apprendre","comprendre","répondre","demander","raconter","rire","pleurer","crier","chuchoter","voler","rouler","tomber","arriver","partir","attendre","commencer","finir","réparer","peindre","planter",

"lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche","printemps","été","automne","hiver","anniversaire","vacances","fête","midi","minuit","hier","demain","aujourd'hui","saison",

"arc-en-ciel","brouillard","tempête","éclair","tonnerre","grêle","flocon","température",

"jouet","poupée","robot","puzzle","cerf-volant","toupie","balançoire","toboggan","trampoline","tambour","guitare","piano","violon","trompette","flûte","parapluie","valise","panier","boîte","bougie","cadeau","drapeau","horloge","pinceau","marteau",

"idée","rêve","secret","surprise","aventure","voyage","trésor","peur","joie","colère","courage","silence","bruit","couleur","forme",

"cercle","carré","triangle","rectangle","losange","astronaute","galaxie","comète","satellite","univers"
];

let hits = 0;
let misses = 0;
let round = null;
let lock = false;

let voices = [];
let ready = false;

const hitsEl = document.getElementById("hits");
const missesEl = document.getElementById("misses");
const grid = document.getElementById("grid");

function shuffle(a){
  return [...a].sort(()=>Math.random()-0.5);
}

// 🔊 LOAD VOICES PROPERLY
function loadVoices(){
  voices = speechSynthesis.getVoices();
  if(voices.length > 0){
    ready = true;
    console.log("Voices ready:", voices.length);
  }
}

// important pour mobile
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

// 🔊 SPEAK ROBUST
function speak(word){
  if(!ready){
    console.log("Voices not ready yet");
    return;
  }

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(word);

  // force FR si possible
  const frVoice = voices.find(v => v.lang.startsWith("fr"));
  if(frVoice) utter.voice = frVoice;

  utter.lang = "fr-FR";
  utter.rate = 0.9;

  speechSynthesis.speak(utter);
}

function nextRound(){
  lock = false;

  const target = words[Math.floor(Math.random()*words.length)];
  const choices = shuffle(
    [target, ...shuffle(words.filter(w=>w!==target)).slice(0,3)]
  );

  round = {target, choices};

  render();

  setTimeout(()=>speak(target),1200);
}

function render(){
  grid.innerHTML = "";

  round.choices.forEach(w=>{
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = w;

    b.onclick = ()=>{
      if(lock) return;

      if(w === round.target){
        lock = true;
        hits++;
        hitsEl.textContent = hits;

        b.classList.add("good");
        speak(w);

        setTimeout(nextRound,800);

      } else {
        misses++;
        missesEl.textContent = misses;

        b.classList.add("bad");
        speak(w);

        setTimeout(()=>b.classList.remove("bad"),300);
      }
    };

    grid.appendChild(b);
  });
}

// 👉 IMPORTANT : premier click débloque audio
document.getElementById("start").onclick = ()=>{
  speechSynthesis.resume(); // 🔥 critical fix
  nextRound();
};

document.getElementById("repeat").onclick = ()=>{
  speechSynthesis.resume();
  if(round) speak(round.target);
};

</script>

</body>
</html>
