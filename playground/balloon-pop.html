<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Balloon Pop — Couleurs en anglais</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: manipulation;
  overflow: hidden;
  user-select: none;
}
.app {
  width: 100%;
  max-width: 430px;
  height: 100vh;
  max-height: 880px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  z-index: 5;
}
.nav-link {
  color: #0369a1;
  text-decoration: none;
  font-weight: 800;
  font-size: 15px;
  background: white;
  padding: 8px 14px;
  border-radius: 999px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.score {
  font-size: 20px;
  font-weight: 900;
  color: #0284c7;
  background: white;
  padding: 6px 14px;
  border-radius: 999px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.repeat-btn {
  background: #0284c7;
  color: white;
  border: none;
  font-weight: 800;
  font-size: 15px;
  padding: 8px 16px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(2, 132, 199, 0.3);
  display: flex;
  align-items: center;
  gap: 6px;
}
.repeat-btn:active { transform: scale(0.96); }

.prompt-card {
  background: white;
  border-radius: 20px;
  padding: 14px;
  text-align: center;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  z-index: 5;
}
.prompt-sub {
  font-size: 13px;
  font-weight: 700;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.prompt-title {
  font-size: 26px;
  font-weight: 900;
  color: #0f172a;
  margin-top: 4px;
}
.prompt-color-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 8px;
  color: white;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

.sky {
  flex: 1;
  position: relative;
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 16px;
  padding: 10px 0;
  z-index: 2;
}

.balloon-btn {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  outline: none;
}
.balloon-btn:active {
  transform: scale(0.92);
}
.balloon-btn.wobble {
  animation: wobbleAnim 0.5s ease;
}
@keyframes wobbleAnim {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  25% { transform: translateX(-12px) rotate(-8deg); }
  50% { transform: translateX(10px) rotate(6deg); }
  75% { transform: translateX(-6px) rotate(-3deg); }
}

.balloon-body {
  width: 120px;
  height: 145px;
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  position: relative;
  box-shadow: inset -10px -10px 18px rgba(0,0,0,0.18), inset 12px 12px 18px rgba(255,255,255,0.45), 0 8px 16px rgba(0,0,0,0.15);
  display: flex;
  justify-content: center;
  align-items: center;
  animation: floatAnim 3s ease-in-out infinite;
}
@keyframes floatAnim {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.balloon-shine {
  position: absolute;
  top: 18px;
  left: 20px;
  width: 24px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.65);
  transform: rotate(-35deg);
}

.balloon-knot {
  width: 14px;
  height: 10px;
  background: inherit;
  filter: brightness(0.85);
  clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
  margin-top: -2px;
}

.balloon-string {
  width: 2px;
  height: 36px;
  background: #94a3b8;
  border-radius: 1px;
}

.feedback-msg {
  text-align: center;
  min-height: 28px;
  font-size: 17px;
  font-weight: 800;
  color: #0369a1;
  margin-bottom: 6px;
}

.confetti-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
}
.confetti-particle {
  position: absolute;
  font-size: 26px;
  animation: popFly 0.7s forwards ease-out;
}
@keyframes popFly {
  0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
}
</style>
</head>
<body>

<div class="app">
  <div class="confetti-layer" id="confettiLayer"></div>

  <div class="top-bar">
    <a class="nav-link" href="jeux-enfants.html">← Jeux</a>
    <div class="score">⭐ <span id="scoreText">0</span></div>
    <button class="repeat-btn" id="repeatBtn">🔊 Listen</button>
  </div>

  <div class="prompt-card">
    <div class="prompt-sub">Pop the balloon</div>
    <div class="prompt-title" id="promptTitle">...</div>
  </div>

  <div class="sky" id="balloonGrid">
    <!-- Balloons will appear here -->
  </div>

  <div class="feedback-msg" id="feedbackMsg">Touch a balloon!</div>
</div>

<script>
const COLORS = [
  { id: 'red', nameEn: 'Red', nameFr: 'rouge', hex: '#ef4444' },
  { id: 'blue', nameEn: 'Blue', nameFr: 'bleu', hex: '#3b82f6' },
  { id: 'yellow', nameEn: 'Yellow', nameFr: 'jaune', hex: '#eab308' },
  { id: 'green', nameEn: 'Green', nameFr: 'vert', hex: '#22c55e' },
  { id: 'purple', nameEn: 'Purple', nameFr: 'violet', hex: '#a855f7' },
  { id: 'orange', nameEn: 'Orange', nameFr: 'orange', hex: '#f97316' },
  { id: 'pink', nameEn: 'Pink', nameFr: 'rose', hex: '#ec4899' }
];

let targetColor = null;
let score = 0;
let lock = false;
let voices = [];

function loadVoices() {
  if ('speechSynthesis' in window) {
    voices = speechSynthesis.getVoices();
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function speak(text, lang = "en-US") {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const v = voices.find(vo => vo.lang.startsWith(lang.slice(0, 2)));
  if (v) utter.voice = v;
  utter.lang = lang;
  utter.rate = 0.88;
  utter.pitch = 1.05;
  speechSynthesis.speak(utter);
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playPopSound() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.09);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.09);
  } catch (e) {}
}

function playBoingSound() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(260, ctx.currentTime);
    osc.frequency.setValueAtTime(210, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.22);
  } catch (e) {}
}

function playCheerChime() {
  try {
    const ctx = getAudioCtx();
    [523, 659, 784, 1046].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      const t = ctx.currentTime + i * 0.08;
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.16);
    });
  } catch (e) {}
}

function spawnConfetti(x, y) {
  const container = document.getElementById("confettiLayer");
  const icons = ['✨', '⭐', '🎈', '🎉'];
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-particle';
    p.textContent = icons[Math.floor(Math.random() * icons.length)];
    p.style.left = `${x}px`;
    p.style.top = `${y}px`;
    const angle = (i / 8) * 2 * Math.PI;
    const dist = 60 + Math.random() * 50;
    p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
    container.appendChild(p);
    setTimeout(() => p.remove(), 750);
  }
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function nextRound() {
  lock = false;
  // Pick 3 or 4 colors
  const count = score < 3 ? 3 : 4;
  const pool = shuffle(COLORS).slice(0, count);
  targetColor = pool[Math.floor(Math.random() * pool.length)];

  const promptTitleEl = document.getElementById("promptTitle");
  promptTitleEl.innerHTML = `Pop <span class="prompt-color-tag" style="background:${targetColor.hex}">${targetColor.nameEn}</span>!`;

  const feedbackMsg = document.getElementById("feedbackMsg");
  feedbackMsg.textContent = `Find the ${targetColor.nameEn} balloon!`;

  const grid = document.getElementById("balloonGrid");
  grid.innerHTML = "";

  pool.forEach((c, idx) => {
    const btn = document.createElement("button");
    btn.className = "balloon-btn";
    btn.setAttribute("aria-label", `${c.nameEn} balloon`);

    const delay = (idx * 0.35).toFixed(2);
    btn.innerHTML = `
      <div class="balloon-body" style="background:${c.hex}; animation-delay: -${delay}s;">
        <div class="balloon-shine"></div>
      </div>
      <div class="balloon-knot" style="background:${c.hex};"></div>
      <div class="balloon-string"></div>
    `;

    btn.onclick = (e) => handleTap(c, btn, e);
    grid.appendChild(btn);
  });

  speak(`Pop the ${targetColor.nameEn} balloon!`);
}

function handleTap(color, btn, event) {
  if (lock) return;

  if (color.id === targetColor.id) {
    lock = true;
    score++;
    document.getElementById("scoreText").textContent = score;

    playPopSound();
    playCheerChime();

    const rect = btn.getBoundingClientRect();
    spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);

    btn.style.transform = "scale(0)";
    btn.style.opacity = "0";
    btn.style.transition = "transform 0.25s ease-out, opacity 0.25s ease-out";

    const feedbackMsg = document.getElementById("feedbackMsg");
    const praise = ["Awesome!", "Great job!", "Yes!", "Super!"][Math.floor(Math.random() * 4)];
    feedbackMsg.textContent = `${color.nameEn}! ${praise} ⭐`;

    speak(`${color.nameEn}! ${praise}`);

    setTimeout(() => {
      nextRound();
    }, 1100);
  } else {
    playBoingSound();
    btn.classList.remove("wobble");
    void btn.offsetWidth;
    btn.classList.add("wobble");

    const feedbackMsg = document.getElementById("feedbackMsg");
    feedbackMsg.textContent = `That is ${color.nameEn}! Where is ${targetColor.nameEn}?`;

    speak(`That is ${color.nameEn}! Find ${targetColor.nameEn}!`);
  }
}

document.getElementById("repeatBtn").onclick = () => {
  if (targetColor) {
    speak(`Pop the ${targetColor.nameEn} balloon!`);
  }
};

window.onload = () => {
  nextRound();
};
</script>
</body>
</html>
