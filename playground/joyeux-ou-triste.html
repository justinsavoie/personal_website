<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyeux ou Triste ?</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #fef3c7 0%, #fde68a 50%, #fed7aa 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: manipulation;
  color: #78350f;
  padding: 12px;
  transition: background 0.5s ease;
}

body.mode-minor {
  background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
  color: #334155;
}

body.mode-major {
  background: linear-gradient(180deg, #fef08a 0%, #fde047 50%, #facc15 100%);
  color: #713f12;
}

.app {
  width: 100%;
  max-width: 430px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 900;
  font-size: 16px;
  color: #92400e;
  background: rgba(255, 255, 255, 0.9);
  padding: 8px 14px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(146, 64, 14, 0.1);
}

.top .stats {
  display: flex;
  gap: 14px;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 8px 24px rgba(180, 83, 9, 0.15);
}

.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 140px;
  background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%);
  border-radius: 20px;
  border: 3px dashed #fde68a;
  position: relative;
  overflow: hidden;
  transition: all 0.4s ease;
}

.stage.major-theme {
  background: linear-gradient(180deg, #fef9c3 0%, #fef08a 100%);
  border-color: #facc15;
}

.stage.minor-theme {
  background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
  border-color: #cbd5e1;
}

.character-visual {
  font-size: 72px;
  line-height: 1;
  user-select: none;
  transition: transform 0.2s cubic-bezier(.2,.8,.3,1.4);
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
}

.character-visual.pulse {
  transform: scale(1.25) rotate(5deg);
}

.character-visual.happy {
  transform: scale(1.3) rotate(-6deg);
}

.character-visual.sad {
  transform: scale(1.2) translateY(6px);
}

.play-music-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 15px;
  font-size: 19px;
  font-weight: 900;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: white;
  border: none;
  border-radius: 18px;
  cursor: pointer;
  box-shadow: 0 5px 0 #b45309;
  transition: transform 0.1s, box-shadow 0.1s;
}

.play-music-btn:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #b45309;
}

.play-music-btn.playing {
  background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
  box-shadow: 0 5px 0 #5b21b6;
  animation: pulse-border 0.8s infinite alternate;
}

@keyframes pulse-border {
  from { transform: scale(1); }
  to { transform: scale(1.02); }
}

.choices-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.choice-card {
  border-radius: 20px;
  padding: 16px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
  border: 4px solid transparent;
}

.choice-card:active {
  transform: translateY(2px);
}

.choice-card.happy-btn {
  background: #fef9c3;
  border-color: #fde047;
  box-shadow: 0 4px 0 #eab308;
  color: #713f12;
}

.choice-card.sad-btn {
  background: #f1f5f9;
  border-color: #cbd5e1;
  box-shadow: 0 4px 0 #94a3b8;
  color: #334155;
}

.choice-card.correct {
  background: #dcfce7 !important;
  border-color: #22c55e !important;
  box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4) !important;
  transform: scale(1.05);
}

.choice-card.wrong {
  background: #ffe4e6 !important;
  border-color: #f43f5e !important;
  box-shadow: 0 3px 8px rgba(244, 63, 94, 0.3) !important;
  animation: shake 0.3s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.choice-icon {
  font-size: 44px;
  line-height: 1;
}

.choice-title {
  font-size: 18px;
  font-weight: 900;
}

.choice-sub {
  font-size: 13px;
  font-weight: 700;
  opacity: 0.8;
}

.message {
  min-height: 28px;
  text-align: center;
  font-size: 16px;
  font-weight: 900;
  color: #92400e;
  display: flex;
  align-items: center;
  justify-content: center;
}

.controls {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 8px;
}

button.ctrl {
  border: none;
  border-radius: 14px;
  background: #f59e0b;
  color: white;
  font-weight: 900;
  font-size: 17px;
  padding: 12px;
  cursor: pointer;
  box-shadow: 0 4px 0 #d97706;
  transition: transform 0.1s, box-shadow 0.1s;
}

button.ctrl:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #d97706;
}

button.ctrl.ghost {
  background: #ffffff;
  color: #b45309;
  border: 3px solid #fde68a;
  box-shadow: 0 3px 0 #fcd34d;
}

button.ctrl:disabled {
  opacity: 0.45;
  cursor: default;
  transform: none !important;
}

@media (max-height: 680px) {
  .stage { height: 115px; }
  .character-visual { font-size: 56px; }
  .choice-card { padding: 10px 6px; }
  .choice-icon { font-size: 36px; }
}
</style>
</head>

<body>
<div class="app">
  <div class="top">
    <div class="stats">
      <div>⭐ <span id="score">0</span></div>
      <div>🔥 <span id="streak">0</span></div>
    </div>
    <div>🎵 Niveau <span id="level">1</span></div>
  </div>

  <div class="card">
    <div class="stage" id="stage">
      <div class="character-visual" id="character">🎵</div>
    </div>

    <button class="play-music-btn" id="play-btn">
      <span>▶</span> Écouter la musique
    </button>

    <div class="choices-grid" id="choices">
      <button class="choice-card happy-btn" id="btn-major">
        <div class="choice-icon">☀️</div>
        <div class="choice-title">Joyeuse !</div>
        <div class="choice-sub">Comme le soleil 😊</div>
      </button>

      <button class="choice-card sad-btn" id="btn-minor">
        <div class="choice-icon">🌧️</div>
        <div class="choice-title">Triste !</div>
        <div class="choice-sub">Comme la pluie 😢</div>
      </button>
    </div>

    <div class="message" id="message"></div>

    <div class="controls">
      <button class="ctrl" id="next-btn">Suivant ➜</button>
      <button class="ctrl ghost" id="voice-btn">🔊</button>
    </div>
  </div>
</div>

<script>
// Base root notes frequencies (Hz)
const ROOTS = [
  { name: "Do", freq: 261.63 },
  { name: "Ré", freq: 293.66 },
  { name: "Mi", freq: 329.63 },
  { name: "Fa", freq: 349.23 },
  { name: "Sol", freq: 392.00 },
  { name: "La", freq: 440.00 }
];

let score = 0;
let streak = 0;
let level = 1;
let currentMode = "MAJOR"; // "MAJOR" or "MINOR"
let currentRoot = ROOTS[0];
let answered = false;
let isPlaying = false;
let voices = [];
let voicesReady = false;
let audioCtx = null;

const scoreEl = document.getElementById("score");
const streakEl = document.getElementById("streak");
const levelEl = document.getElementById("level");
const stageEl = document.getElementById("stage");
const characterEl = document.getElementById("character");
const playBtn = document.getElementById("play-btn");
const btnMajor = document.getElementById("btn-major");
const btnMinor = document.getElementById("btn-minor");
const messageEl = document.getElementById("message");
const nextBtn = document.getElementById("next-btn");
const voiceBtn = document.getElementById("voice-btn");

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  return audioCtx;
}

// Text-to-speech
function loadVoices() {
  voices = speechSynthesis.getVoices();
  if (voices.length > 0) voicesReady = true;
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
  if (!voicesReady && !speechSynthesis.getVoices().length) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const v = voices.find(v => v.lang.startsWith("fr"));
  if (v) utter.voice = v;
  utter.lang = "fr-FR";
  utter.rate = 0.95;
  speechSynthesis.speak(utter);
}

// Convert semitone offset to frequency
function noteFreq(rootFreq, semitones) {
  return rootFreq * Math.pow(2, semitones / 12);
}

// Warm harp / glockenspiel / marimba synth
function playTone(freq, time, duration = 0.65, gainLevel = 0.35) {
  const ctx = getAudioContext();
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gain = ctx.createGain();

  osc1.type = "sine";
  osc1.frequency.setValueAtTime(freq, time);

  // Soft octave harmonic
  osc2.type = "triangle";
  osc2.frequency.setValueAtTime(freq * 2, time);

  gain.gain.setValueAtTime(0.001, time);
  gain.gain.linearRampToValueAtTime(gainLevel, time + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(ctx.destination);

  osc1.start(time);
  osc2.start(time);
  osc1.stop(time + duration + 0.05);
  osc2.stop(time + duration + 0.05);
}

function sfxVictory() {
  const ctx = getAudioContext();
  const chord = [523.25, 659.25, 783.99, 1046.50];
  chord.forEach((freq, i) => {
    playTone(freq, ctx.currentTime + i * 0.08, 0.45, 0.3);
  });
}

function sfxGentleTryAgain() {
  const ctx = getAudioContext();
  playTone(293.66, ctx.currentTime, 0.25, 0.2);
  playTone(261.63, ctx.currentTime + 0.15, 0.35, 0.2);
}

function playMusicPhrase() {
  if (isPlaying) return;
  isPlaying = true;
  playBtn.classList.add("playing");
  playBtn.innerHTML = "<span>🔊</span> Écoute bien...";
  characterEl.className = "character-visual pulse";

  const ctx = getAudioContext();
  const rFreq = currentRoot.freq;
  const isMajor = currentMode === "MAJOR";
  const thirdInterval = isMajor ? 4 : 3; // Major 3rd (+4 st) vs Minor 3rd (+3 st)

  // Melodic notes sequence: Root -> 3rd -> 5th -> Octave -> 5th -> 3rd -> Final chord bloom
  const sequence = [
    { semitones: 0, delay: 0.0, dur: 0.45 },
    { semitones: thirdInterval, delay: 0.28, dur: 0.45 },
    { semitones: 7, delay: 0.56, dur: 0.45 },
    { semitones: 12, delay: 0.84, dur: 0.55 },
    { semitones: 7, delay: 1.15, dur: 0.45 },
    { semitones: thirdInterval, delay: 1.42, dur: 0.65 }
  ];

  const startTime = ctx.currentTime + 0.1;

  sequence.forEach(item => {
    const f = noteFreq(rFreq, item.semitones);
    playTone(f, startTime + item.delay, item.dur);
  });

  // Final sustained harmony bloom
  setTimeout(() => {
    const tBloom = ctx.currentTime;
    playTone(noteFreq(rFreq, 0), tBloom, 0.9, 0.2);
    playTone(noteFreq(rFreq, thirdInterval), tBloom, 0.9, 0.2);
    playTone(noteFreq(rFreq, 7), tBloom, 0.9, 0.2);
  }, 1750);

  setTimeout(() => {
    isPlaying = false;
    playBtn.classList.remove("playing");
    playBtn.innerHTML = "<span>▶</span> Réécouter";
    if (!answered) {
      characterEl.className = "character-visual";
    }
  }, 2700);
}

function newRound() {
  answered = false;
  messageEl.textContent = "";
  nextBtn.disabled = true;
  document.body.className = "";
  stageEl.className = "stage";
  characterEl.className = "character-visual";
  characterEl.textContent = "🎵";

  btnMajor.className = "choice-card happy-btn";
  btnMinor.className = "choice-card sad-btn";
  btnMajor.disabled = false;
  btnMinor.disabled = false;

  // Pick random mode & root
  currentMode = Math.random() < 0.5 ? "MAJOR" : "MINOR";
  currentRoot = ROOTS[Math.floor(Math.random() * ROOTS.length)];

  setTimeout(() => {
    playMusicPhrase();
  }, 350);
}

function handleChoice(chosenMode, btn) {
  if (answered || isPlaying) return;

  if (chosenMode === currentMode) {
    answered = true;
    score += 10;
    streak += 1;
    scoreEl.textContent = score;
    streakEl.textContent = streak;

    btn.classList.add("correct");

    if (currentMode === "MAJOR") {
      document.body.className = "mode-major";
      stageEl.className = "stage major-theme";
      characterEl.className = "character-visual happy";
      characterEl.textContent = "☀️";
      messageEl.textContent = "Bravo ! C'est une musique joyeuse ! 😊🎉";
      speak("Bravo ! C'est joyeux !");
    } else {
      document.body.className = "mode-minor";
      stageEl.className = "stage minor-theme";
      characterEl.className = "character-visual sad";
      characterEl.textContent = "🌧️";
      messageEl.textContent = "Super ! C'est une musique triste / douce ! 🌧️";
      speak("Super ! C'est triste !");
    }

    sfxVictory();

    // Progress level every 5 consecutive streaks
    if (streak % 5 === 0 && level < 3) {
      level += 1;
      levelEl.textContent = level;
      messageEl.textContent = `🎉 Niveau ${level} débloqué !`;
      speak(`Niveau ${level} !`);
    }

    nextBtn.disabled = false;
    btnMajor.disabled = true;
    btnMinor.disabled = true;

  } else {
    btn.classList.add("wrong");
    messageEl.textContent = "Presque ! Réécoute l'ambiance de la musique 👂";
    sfxGentleTryAgain();
    speak("Presque ! Réécoute bien.");
    streak = 0;
    streakEl.textContent = streak;

    setTimeout(() => {
      btn.classList.remove("wrong");
    }, 600);
  }
}

btnMajor.addEventListener("click", () => handleChoice("MAJOR", btnMajor));
btnMinor.addEventListener("click", () => handleChoice("MINOR", btnMinor));

playBtn.addEventListener("click", () => {
  getAudioContext();
  playMusicPhrase();
});

nextBtn.addEventListener("click", () => {
  newRound();
});

voiceBtn.addEventListener("click", () => {
  speak("Écoute la musique ! Est-ce qu'elle est joyeuse comme le soleil ou triste comme la pluie ?");
});

newRound();
</script>
</body>
</html>
