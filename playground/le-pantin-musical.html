<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le pantin musical</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #fdf4ff 0%, #fae8ff 50%, #f5d0fe 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: manipulation;
  color: #701a75;
  padding: 12px;
}

.app {
  width: 100%;
  max-width: 430px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 900;
  font-size: 16px;
  color: #86198f;
  background: rgba(255, 255, 255, 0.92);
  padding: 8px 14px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(134, 25, 143, 0.1);
}

.top-bar .stats {
  display: flex;
  gap: 14px;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 8px 24px rgba(162, 28, 175, 0.15);
  position: relative;
}

/* Puppet Stage */
.puppet-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: linear-gradient(180deg, #faf5ff 0%, #f3e8ff 100%);
  border-radius: 20px;
  border: 3px dashed #e9d5ff;
  padding: 12px 10px;
  position: relative;
}

.puppet-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 8px;
}

.puppet-face {
  font-size: 44px;
  line-height: 1;
  user-select: none;
  transition: transform 0.2s cubic-bezier(.2,.8,.3,1.4);
}

.puppet-face.dance {
  animation: danceWiggle 0.4s ease infinite alternate;
}

@keyframes danceWiggle {
  from { transform: scale(1.15) rotate(-10deg); }
  to { transform: scale(1.15) rotate(10deg); }
}

.music-sparkle {
  font-size: 24px;
  opacity: 0;
  transition: opacity 0.2s, transform 0.3s;
}

.music-sparkle.show {
  opacity: 1;
  transform: translateY(-8px) scale(1.2);
}

/* Body buttons container */
.body-zones {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  max-width: 320px;
}

.zone-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-radius: 18px;
  border: 4px solid transparent;
  cursor: pointer;
  font-weight: 900;
  font-size: 17px;
  transition: all 0.15s ease;
  user-select: none;
  box-shadow: 0 4px 0 rgba(0,0,0,0.08);
}

.zone-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.08);
}

.zone-btn .zone-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.zone-btn .zone-icon {
  font-size: 28px;
  line-height: 1;
}

.zone-btn .zone-tag {
  font-size: 13px;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.85);
}

/* Themes per body zone */
.zone-head {
  background: #f3e8ff;
  border-color: #d8b4fe;
  color: #6b21a8;
  box-shadow: 0 4px 0 #c084fc;
}
.zone-head .zone-tag { color: #6b21a8; }

.zone-shoulders {
  background: #e0f2fe;
  border-color: #7dd3fc;
  color: #0369a1;
  box-shadow: 0 4px 0 #38bdf8;
}
.zone-shoulders .zone-tag { color: #0369a1; }

.zone-belly {
  background: #fef9c3;
  border-color: #fde047;
  color: #854d0e;
  box-shadow: 0 4px 0 #eab308;
}
.zone-belly .zone-tag { color: #854d0e; }

.zone-feet {
  background: #fee2e2;
  border-color: #fca5a5;
  color: #991b1b;
  box-shadow: 0 4px 0 #f87171;
}
.zone-feet .zone-tag { color: #991b1b; }

/* Pulse animation when playing reference or cue */
.zone-btn.pulse-ref {
  transform: scale(1.04);
  box-shadow: 0 0 16px rgba(239, 68, 68, 0.6) !important;
}

.zone-btn.correct-flash {
  background: #dcfce7 !important;
  border-color: #22c55e !important;
  color: #15803d !important;
  box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4) !important;
  transform: scale(1.06);
}

.zone-btn.wrong-flash {
  background: #ffe4e6 !important;
  border-color: #f43f5e !important;
  color: #be123c !important;
  animation: shake 0.3s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.play-music-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: 900;
  background: linear-gradient(135deg, #a21caf 0%, #86198f 100%);
  color: white;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 5px 0 #701a75;
  transition: transform 0.1s, box-shadow 0.1s;
}

.play-music-btn:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #701a75;
}

.play-music-btn.playing {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  box-shadow: 0 5px 0 #b45309;
}

.message {
  min-height: 26px;
  text-align: center;
  font-size: 15px;
  font-weight: 900;
  color: #86198f;
  display: flex;
  align-items: center;
  justify-content: center;
}

.controls {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 8px;
}

button.ctrl {
  border: none;
  border-radius: 14px;
  background: #a21caf;
  color: white;
  font-weight: 900;
  font-size: 17px;
  padding: 12px;
  cursor: pointer;
  box-shadow: 0 4px 0 #701a75;
  transition: transform 0.1s, box-shadow 0.1s;
}

button.ctrl:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #701a75;
}

button.ctrl.ghost {
  background: #ffffff;
  color: #86198f;
  border: 3px solid #f5d0fe;
  box-shadow: 0 3px 0 #e879f9;
}

button.ctrl:disabled {
  opacity: 0.45;
  cursor: default;
  transform: none !important;
}

/* Start Overlay to guarantee sound unlock on mobile */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.96);
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 20px;
  z-index: 100;
  text-align: center;
  box-shadow: 0 8px 24px rgba(162, 28, 175, 0.2);
}

.overlay.hidden {
  display: none;
}

.overlay h1 {
  font-size: 26px;
  font-weight: 900;
  color: #86198f;
}

.overlay p {
  font-size: 16px;
  font-weight: 700;
  color: #701a75;
  max-width: 280px;
  line-height: 1.4;
}

.start-btn {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
  font-size: 22px;
  font-weight: 900;
  padding: 16px 40px;
  border: none;
  border-radius: 20px;
  box-shadow: 0 6px 0 #047857;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
}

.start-btn:active {
  transform: translateY(3px);
  box-shadow: 0 3px 0 #047857;
}

@media (max-height: 680px) {
  .puppet-face { font-size: 38px; }
  .zone-btn { padding: 9px 12px; font-size: 15px; }
  .zone-btn .zone-icon { font-size: 24px; }
}
</style>
</head>

<body>
<div class="app">
  <div class="top-bar">
    <div class="stats">
      <div>⭐ <span id="score">0</span></div>
      <div>🔥 <span id="streak">0</span></div>
    </div>
    <div>🎵 Niveau <span id="level">1</span></div>
  </div>

  <div class="card">
    <div class="puppet-stage">
      <div class="puppet-header">
        <div class="puppet-face" id="puppet-face">🐻</div>
        <div class="music-sparkle" id="sparkle">🎵</div>
      </div>
      <div class="body-zones" id="zones"></div>
    </div>

    <button class="play-music-btn" id="play-btn">
      <span>▶</span> Écouter le son
    </button>

    <div class="message" id="message"></div>

    <div class="controls">
      <button class="ctrl" id="next-btn" disabled>Suivant ➜</button>
      <button class="ctrl ghost" id="voice-btn">🔊</button>
    </div>

    <!-- Start Modal to guarantee audio unlock on iOS/Android -->
    <div class="overlay" id="overlay">
      <div style="font-size: 64px;">🐻🎵</div>
      <h1>Le pantin musical</h1>
      <p>Écoute où chante le pantin : sur les pieds, le ventre ou la tête !</p>
      <button class="start-btn" id="start-game-btn">▶ Jouer</button>
    </div>
  </div>
</div>

<script>
// Body zones definition with clear musical pitches
const ZONES = {
  HEAD: {
    id: "HEAD",
    name: "La Tête",
    icon: "👑",
    tag: "Très haut ⬆️",
    freq: 523.25, // C5 (Do aigu)
    cssClass: "zone-head",
    order: 4
  },
  SHOULDERS: {
    id: "SHOULDERS",
    name: "Les Épaules",
    icon: "👕",
    tag: "Sol",
    freq: 392.00, // G4 (Sol)
    cssClass: "zone-shoulders",
    order: 3
  },
  BELLY: {
    id: "BELLY",
    name: "Le Ventre",
    icon: "🧸",
    tag: "Milieu",
    freq: 329.63, // E4 (Mi)
    cssClass: "zone-belly",
    order: 2
  },
  FEET: {
    id: "FEET",
    name: "Les Pieds",
    icon: "🦶",
    tag: "Tout en bas ⬇️",
    freq: 261.63, // C4 (Do grave)
    cssClass: "zone-feet",
    order: 1
  }
};

// Gentle level progression for 4-5 year olds
const LEVELS = {
  1: ["HEAD", "FEET"],                 // Big contrast: Top vs Bottom
  2: ["HEAD", "BELLY", "FEET"],         // Triad: Top, Middle, Bottom
  3: ["HEAD", "SHOULDERS", "BELLY", "FEET"] // Full 4-note scale
};

let score = 0;
let streak = 0;
let level = 1;
let currentTargetZone = null;
let answered = false;
let isPlaying = false;
let voices = [];
let voicesReady = false;
let audioCtx = null;

const scoreEl = document.getElementById("score");
const streakEl = document.getElementById("streak");
const levelEl = document.getElementById("level");
const puppetFace = document.getElementById("puppet-face");
const sparkleEl = document.getElementById("sparkle");
const zonesContainer = document.getElementById("zones");
const playBtn = document.getElementById("play-btn");
const messageEl = document.getElementById("message");
const nextBtn = document.getElementById("next-btn");
const voiceBtn = document.getElementById("voice-btn");
const overlay = document.getElementById("overlay");
const startGameBtn = document.getElementById("start-game-btn");

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  return audioCtx;
}

// Text-to-speech
function loadVoices() {
  voices = speechSynthesis.getVoices();
  if (voices.length > 0) voicesReady = true;
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
  if (!voicesReady && !speechSynthesis.getVoices().length) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const v = voices.find(v => v.lang.startsWith("fr"));
  if (v) utter.voice = v;
  utter.lang = "fr-FR";
  utter.rate = 0.95;
  speechSynthesis.speak(utter);
}

// Warm resonant marimba / glockenspiel synth
function playTone(freq, time, duration = 0.65, gainLevel = 0.35) {
  const ctx = getAudioContext();
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gain = ctx.createGain();

  osc1.type = "sine";
  osc1.frequency.setValueAtTime(freq, time);

  // Soft overtone
  osc2.type = "triangle";
  osc2.frequency.setValueAtTime(freq * 2, time);

  gain.gain.setValueAtTime(0.001, time);
  gain.gain.linearRampToValueAtTime(gainLevel, time + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(ctx.destination);

  osc1.start(time);
  osc2.start(time);
  osc1.stop(time + duration + 0.05);
  osc2.stop(time + duration + 0.05);
}

function sfxVictory() {
  const ctx = getAudioContext();
  const chord = [523.25, 659.25, 783.99, 1046.50];
  chord.forEach((freq, i) => {
    playTone(freq, ctx.currentTime + i * 0.08, 0.45, 0.3);
  });
}

function getActiveZones() {
  const ids = LEVELS[level] || LEVELS[1];
  return ids.map(id => ZONES[id]);
}

function renderZones() {
  zonesContainer.innerHTML = "";
  const activeZones = getActiveZones();

  activeZones.forEach(zone => {
    const btn = document.createElement("button");
    btn.className = `zone-btn ${zone.cssClass}`;
    btn.dataset.id = zone.id;

    const left = document.createElement("div");
    left.className = "zone-left";

    const icon = document.createElement("span");
    icon.className = "zone-icon";
    icon.textContent = zone.icon;

    const name = document.createElement("span");
    name.textContent = zone.name;

    left.appendChild(icon);
    left.appendChild(name);

    const tag = document.createElement("span");
    tag.className = "zone-tag";
    tag.textContent = zone.tag;

    btn.appendChild(left);
    btn.appendChild(tag);

    btn.addEventListener("click", () => handleZoneClick(zone, btn));
    zonesContainer.appendChild(btn);
  });
}

// Sequence: 1. Anchor ground note (Feet 🦶) -> 2. Target Note!
function playAudioCue() {
  if (isPlaying || !currentTargetZone) return;
  isPlaying = true;
  playBtn.classList.add("playing");
  playBtn.innerHTML = "<span>🔊</span> Écoute bien...";
  sparkleEl.classList.add("show");
  puppetFace.textContent = "😮";

  const ctx = getAudioContext();
  const t0 = ctx.currentTime + 0.08;
  const t1 = t0 + 0.65;

  // 1. Play anchor ground note (Feet / Do grave)
  playTone(ZONES.FEET.freq, t0, 0.45, 0.28);
  const feetBtn = document.querySelector(`.zone-btn[data-id="FEET"]`);
  if (feetBtn) {
    feetBtn.classList.add("pulse-ref");
    setTimeout(() => feetBtn.classList.remove("pulse-ref"), 400);
  }

  // 2. Play mystery target note
  setTimeout(() => {
    playTone(currentTargetZone.freq, ctx.currentTime, 0.75, 0.4);
    sparkleEl.textContent = "🎶";
  }, 620);

  setTimeout(() => {
    isPlaying = false;
    playBtn.classList.remove("playing");
    playBtn.innerHTML = "<span>▶</span> Réécouter";
    sparkleEl.classList.remove("show");
    if (!answered) {
      puppetFace.textContent = "🐻";
    }
  }, 1450);
}

function newRound() {
  answered = false;
  messageEl.textContent = "";
  nextBtn.disabled = true;
  puppetFace.textContent = "🐻";
  puppetFace.className = "puppet-face";

  renderZones();

  const activeZones = getActiveZones();
  currentTargetZone = activeZones[Math.floor(Math.random() * activeZones.length)];

  setTimeout(() => {
    playAudioCue();
  }, 350);
}

function handleZoneClick(zone, btn) {
  if (answered || isPlaying) return;

  // Immediate sound response on touch
  const ctx = getAudioContext();
  playTone(zone.freq, ctx.currentTime, 0.5, 0.35);

  if (zone.id === currentTargetZone.id) {
    answered = true;
    score += 10;
    streak += 1;
    scoreEl.textContent = score;
    streakEl.textContent = streak;

    btn.classList.add("correct-flash");
    puppetFace.textContent = "🎉";
    puppetFace.className = "puppet-face dance";
    messageEl.textContent = `Bravo ! C'est ${zone.name.toLowerCase()} ! 👏`;
    
    sfxVictory();
    speak(`Bravo ! C'est ${zone.name.toLowerCase()} !`);

    // Level progression every 4 streaks
    if (streak % 4 === 0 && level < 3) {
      level += 1;
      levelEl.textContent = level;
      messageEl.textContent = `🎉 Niveau ${level} débloqué !`;
      speak(`Niveau ${level} !`);
    }

    nextBtn.disabled = false;
    Array.from(zonesContainer.children).forEach(b => {
      if (b !== btn) b.disabled = true;
    });

  } else {
    btn.classList.add("wrong-flash");
    streak = 0;
    streakEl.textContent = streak;

    if (zone.order < currentTargetZone.order) {
      messageEl.textContent = "C'est plus haut ! Monte vers la tête ⬆️";
      speak("C'est plus haut ! Monte vers la tête !");
    } else {
      messageEl.textContent = "C'est plus bas ! Descends vers les pieds ⬇️";
      speak("C'est plus bas ! Descends vers les pieds !");
    }

    setTimeout(() => {
      btn.classList.remove("wrong-flash");
    }, 600);
  }
}

playBtn.addEventListener("click", () => {
  getAudioContext();
  playAudioCue();
});

nextBtn.addEventListener("click", () => {
  newRound();
});

voiceBtn.addEventListener("click", () => {
  speak("Écoute le pantin ! Touche la bonne partie de son corps : les pieds, le ventre ou la tête !");
});

// Start button on overlay to unlock audio context reliably
startGameBtn.addEventListener("click", () => {
  const ctx = getAudioContext();
  if (ctx.state === "suspended") ctx.resume();
  speechSynthesis.resume();
  overlay.classList.add("hidden");
  newRound();
});
</script>
</body>
</html>
