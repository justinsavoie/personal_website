<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le pantin musical</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #fdf4ff 0%, #fae8ff 50%, #f5d0fe 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: manipulation;
  color: #701a75;
  padding: 12px;
}

.app {
  width: 100%;
  max-width: 430px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 900;
  font-size: 16px;
  color: #86198f;
  background: rgba(255, 255, 255, 0.9);
  padding: 8px 14px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(134, 25, 143, 0.1);
}

.top .stats {
  display: flex;
  gap: 14px;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 8px 24px rgba(162, 28, 175, 0.15);
}

.puppet-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #faf5ff 0%, #f3e8ff 100%);
  border-radius: 20px;
  border: 3px dashed #e9d5ff;
  padding: 12px 8px;
  position: relative;
  min-height: 320px;
}

.puppet-avatar {
  font-size: 48px;
  line-height: 1;
  margin-bottom: 8px;
  user-select: none;
  transition: transform 0.2s cubic-bezier(.2,.8,.3,1.4);
}

.puppet-avatar.dance {
  animation: puppetDance 0.5s ease infinite alternate;
}

@keyframes puppetDance {
  from { transform: scale(1.1) rotate(-8deg); }
  to { transform: scale(1.1) rotate(8deg); }
}

.body-zones {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 320px;
}

.zone-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-radius: 18px;
  border: 3px solid transparent;
  cursor: pointer;
  font-weight: 900;
  transition: all 0.15s ease;
  user-select: none;
  box-shadow: 0 4px 0 rgba(0,0,0,0.08);
}

.zone-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.08);
}

.zone-btn .zone-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
}

.zone-btn .zone-icon {
  font-size: 26px;
  line-height: 1;
}

.zone-btn .zone-note {
  font-size: 15px;
  font-weight: 900;
  padding: 4px 10px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.85);
}

/* Zone colors */
.zone-head {
  background: #f3e8ff;
  border-color: #d8b4fe;
  color: #6b21a8;
}
.zone-head .zone-note { color: #6b21a8; }

.zone-shoulders {
  background: #e0f2fe;
  border-color: #7dd3fc;
  color: #0369a1;
}
.zone-shoulders .zone-note { color: #0369a1; }

.zone-belly {
  background: #fef9c3;
  border-color: #fde047;
  color: #854d0e;
}
.zone-belly .zone-note { color: #854d0e; }

.zone-knees {
  background: #ffedd5;
  border-color: #fdba74;
  color: #9a3412;
}
.zone-knees .zone-note { color: #9a3412; }

.zone-feet {
  background: #fee2e2;
  border-color: #fca5a5;
  color: #991b1b;
}
.zone-feet .zone-note { color: #991b1b; }

.zone-btn.highlight-play {
  transform: scale(1.05);
  box-shadow: 0 0 16px rgba(217, 70, 239, 0.6) !important;
}

.zone-btn.correct-flash {
  background: #dcfce7 !important;
  border-color: #22c55e !important;
  box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4) !important;
  transform: scale(1.06);
}

.zone-btn.wrong-flash {
  background: #ffe4e6 !important;
  border-color: #f43f5e !important;
  animation: shake 0.3s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.play-music-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: 900;
  background: linear-gradient(135deg, #a21caf 0%, #86198f 100%);
  color: white;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 5px 0 #701a75;
  transition: transform 0.1s, box-shadow 0.1s;
}

.play-music-btn:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #701a75;
}

.play-music-btn.playing {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  box-shadow: 0 5px 0 #b45309;
}

.message {
  min-height: 28px;
  text-align: center;
  font-size: 15px;
  font-weight: 900;
  color: #86198f;
  display: flex;
  align-items: center;
  justify-content: center;
}

.controls {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 8px;
}

button.ctrl {
  border: none;
  border-radius: 14px;
  background: #a21caf;
  color: white;
  font-weight: 900;
  font-size: 17px;
  padding: 12px;
  cursor: pointer;
  box-shadow: 0 4px 0 #701a75;
  transition: transform 0.1s, box-shadow 0.1s;
}

button.ctrl:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #701a75;
}

button.ctrl.ghost {
  background: #ffffff;
  color: #86198f;
  border: 3px solid #f5d0fe;
  box-shadow: 0 3px 0 #e879f9;
}

button.ctrl:disabled {
  opacity: 0.45;
  cursor: default;
  transform: none !important;
}

@media (max-height: 680px) {
  .puppet-stage { min-height: 280px; padding: 8px 4px; }
  .zone-btn { padding: 8px 12px; font-size: 14px; }
  .zone-icon { font-size: 22px; }
}
</style>
</head>

<body>
<div class="app">
  <div class="top">
    <div class="stats">
      <div>⭐ <span id="score">0</span></div>
      <div>🔥 <span id="streak">0</span></div>
    </div>
    <div>🎵 Niveau <span id="level">1</span></div>
  </div>

  <div class="card">
    <div class="puppet-stage">
      <div class="puppet-avatar" id="avatar">🐻</div>
      <div class="body-zones" id="zones"></div>
    </div>

    <button class="play-music-btn" id="play-btn">
      <span>▶</span> Écouter la note
    </button>

    <div class="message" id="message"></div>

    <div class="controls">
      <button class="ctrl" id="next-btn">Suivant ➜</button>
      <button class="ctrl ghost" id="voice-btn">🔊</button>
    </div>
  </div>
</div>

<script>
// Body zones with notes and frequencies
const ALL_ZONES = [
  { id: "HEAD",       name: "La Tête",      note: "Do aigu", icon: "👑", freq: 523.25, class: "zone-head",       heightOrder: 4 },
  { id: "SHOULDERS",  name: "Les Épaules",  note: "Sol",     icon: "👕", freq: 392.00, class: "zone-shoulders",  heightOrder: 3 },
  { id: "BELLY",      name: "Le Ventre",    note: "Mi",      icon: "🧸", freq: 329.63, class: "zone-belly",      heightOrder: 2 },
  { id: "KNEES",      name: "Les Genoux",   note: "Ré",      icon: "🦵", freq: 293.66, class: "zone-knees",      heightOrder: 1.5 },
  { id: "FEET",       name: "Les Pieds",    note: "Do grave",icon: "🦶", freq: 261.63, class: "zone-feet",       heightOrder: 1 }
];

// Active zones by difficulty level
const LEVEL_CONFIGS = {
  1: ["HEAD", "BELLY", "FEET"],               // Triad (Sol, Mi, Do)
  2: ["HEAD", "SHOULDERS", "BELLY", "FEET"],   // Full Arpeggio (Do aigu, Sol, Mi, Do)
  3: ["HEAD", "SHOULDERS", "BELLY", "KNEES", "FEET"] // Pentatonic / 5 levels
};

let score = 0;
let streak = 0;
let level = 1;
let currentTargetZone = null;
let answered = false;
let isPlaying = false;
let voices = [];
let voicesReady = false;
let audioCtx = null;

const scoreEl = document.getElementById("score");
const streakEl = document.getElementById("streak");
const levelEl = document.getElementById("level");
const avatarEl = document.getElementById("avatar");
const zonesContainer = document.getElementById("zones");
const playBtn = document.getElementById("play-btn");
const messageEl = document.getElementById("message");
const nextBtn = document.getElementById("next-btn");
const voiceBtn = document.getElementById("voice-btn");

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  return audioCtx;
}

// Text-to-speech
function loadVoices() {
  voices = speechSynthesis.getVoices();
  if (voices.length > 0) voicesReady = true;
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
  if (!voicesReady && !speechSynthesis.getVoices().length) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const v = voices.find(v => v.lang.startsWith("fr"));
  if (v) utter.voice = v;
  utter.lang = "fr-FR";
  utter.rate = 0.95;
  speechSynthesis.speak(utter);
}

// Sweet Glockenspiel / Xylophone synth
function playTone(freq, time, duration = 0.65, gainLevel = 0.35) {
  const ctx = getAudioContext();
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gain = ctx.createGain();

  osc1.type = "sine";
  osc1.frequency.setValueAtTime(freq, time);

  // Soft overtone
  osc2.type = "triangle";
  osc2.frequency.setValueAtTime(freq * 2, time);

  gain.gain.setValueAtTime(0.001, time);
  gain.gain.linearRampToValueAtTime(gainLevel, time + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(ctx.destination);

  osc1.start(time);
  osc2.start(time);
  osc1.stop(time + duration + 0.05);
  osc2.stop(time + duration + 0.05);
}

function sfxVictory() {
  const ctx = getAudioContext();
  const chord = [523.25, 659.25, 783.99, 1046.50];
  chord.forEach((freq, i) => {
    playTone(freq, ctx.currentTime + i * 0.08, 0.45, 0.3);
  });
}

function getActiveZones() {
  const ids = LEVEL_CONFIGS[level] || LEVEL_CONFIGS[1];
  return ALL_ZONES.filter(z => ids.includes(z.id));
}

function renderZones() {
  zonesContainer.innerHTML = "";
  const activeZones = getActiveZones();

  activeZones.forEach(zone => {
    const btn = document.createElement("button");
    btn.className = `zone-btn ${zone.class}`;
    btn.dataset.id = zone.id;

    const left = document.createElement("div");
    left.className = "zone-left";

    const icon = document.createElement("span");
    icon.className = "zone-icon";
    icon.textContent = zone.icon;

    const name = document.createElement("span");
    name.textContent = zone.name;

    left.appendChild(icon);
    left.appendChild(name);

    const note = document.createElement("span");
    note.className = "zone-note";
    note.textContent = zone.note;

    btn.appendChild(left);
    btn.appendChild(note);

    btn.addEventListener("click", () => handleZoneClick(zone, btn));
    zonesContainer.appendChild(btn);
  });
}

function playTargetAudio() {
  if (isPlaying || !currentTargetZone) return;
  isPlaying = true;
  playBtn.classList.add("playing");
  playBtn.innerHTML = "<span>🔊</span> Écoute bien...";
  avatarEl.textContent = "🎵";

  const ctx = getAudioContext();
  const t = ctx.currentTime + 0.1;
  playTone(currentTargetZone.freq, t, 0.75, 0.4);

  setTimeout(() => {
    isPlaying = false;
    playBtn.classList.remove("playing");
    playBtn.innerHTML = "<span>▶</span> Réécouter";
    if (!answered) {
      avatarEl.textContent = "🐻";
    }
  }, 900);
}

function newRound() {
  answered = false;
  messageEl.textContent = "";
  nextBtn.disabled = true;
  avatarEl.textContent = "🐻";
  avatarEl.className = "puppet-avatar";

  renderZones();

  const activeZones = getActiveZones();
  currentTargetZone = activeZones[Math.floor(Math.random() * activeZones.length)];

  setTimeout(() => {
    playTargetAudio();
  }, 350);
}

function handleZoneClick(zone, btn) {
  if (answered || isPlaying) return;

  // Play the clicked note immediately so the child hears where their hand tapped
  const ctx = getAudioContext();
  playTone(zone.freq, ctx.currentTime, 0.5, 0.35);

  if (zone.id === currentTargetZone.id) {
    answered = true;
    score += 10;
    streak += 1;
    scoreEl.textContent = score;
    streakEl.textContent = streak;

    btn.classList.add("correct-flash");
    avatarEl.textContent = "🎉";
    avatarEl.className = "puppet-avatar dance";
    messageEl.textContent = `Bravo ! C'est ${zone.note} sur ${zone.name.toLowerCase()} ! 👏`;
    
    sfxVictory();
    speak(`Bravo ! C'est ${zone.note} sur ${zone.name.toLowerCase()} !`);

    // Level progression every 5 streaks
    if (streak % 5 === 0 && level < 3) {
      level += 1;
      levelEl.textContent = level;
      messageEl.textContent = `🎉 Niveau ${level} débloqué !`;
      speak(`Niveau ${level} !`);
    }

    nextBtn.disabled = false;
    Array.from(zonesContainer.children).forEach(b => {
      if (b !== btn) b.disabled = true;
    });

  } else {
    btn.classList.add("wrong-flash");
    streak = 0;
    streakEl.textContent = streak;

    if (zone.heightOrder < currentTargetZone.heightOrder) {
      messageEl.textContent = "C'est plus haut ! Monte vers la tête ⬆️";
      speak("C'est plus haut ! Monte vers la tête !");
    } else {
      messageEl.textContent = "C'est plus bas ! Descends vers les pieds ⬇️";
      speak("C'est plus bas ! Descends vers les pieds !");
    }

    setTimeout(() => {
      btn.classList.remove("wrong-flash");
    }, 600);
  }
}

playBtn.addEventListener("click", () => {
  getAudioContext();
  playTargetAudio();
});

nextBtn.addEventListener("click", () => {
  newRound();
});

voiceBtn.addEventListener("click", () => {
  speak("Écoute la note du pantin ! Touche la bonne partie de son corps : les pieds, le ventre ou la tête !");
});

newRound();
</script>
</body>
</html>
