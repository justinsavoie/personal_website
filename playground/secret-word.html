<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Secret Word — Additions et mots en anglais</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #ddd6fe 0%, #ede9fe 100%);
  display: flex;
  justify-content: center;
  touch-action: manipulation;
  user-select: none;
}
.app {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  padding: 12px 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.top-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.nav-link {
  color: #5b21b6; text-decoration: none; font-weight: 800; font-size: 15px;
  background: white; padding: 8px 14px; border-radius: 999px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.score {
  font-size: 20px; font-weight: 900; color: #6d28d9; background: white;
  padding: 6px 14px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.levels { display: flex; gap: 8px; }
.level {
  flex: 1; border: 3px solid transparent; background: white; color: #5b21b6;
  font-weight: 800; font-size: 14px; padding: 8px 4px; border-radius: 14px; cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.level.on { border-color: #7c3aed; background: #f5f3ff; }

.picture-card {
  background: white; border-radius: 22px; padding: 10px 12px 14px; text-align: center;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}
.picture { font-size: 68px; line-height: 1.1; }
.picture.bounce { animation: bounce 0.7s ease; }
@keyframes bounce {
  0%,100% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-14px) scale(1.15); }
  60% { transform: translateY(0) scale(0.95); }
}
.slots { display: flex; justify-content: center; gap: 8px; margin-top: 6px; }
.slot {
  width: 52px; height: 60px; border-radius: 14px; border: 3px dashed #c4b5fd;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; font-weight: 900; color: #5b21b6; background: #faf5ff;
}
.slot.active { border-style: solid; border-color: #7c3aed; animation: pulse 1.2s infinite; }
.slot.filled { border-style: solid; border-color: #22c55e; background: #f0fdf4; color: #15803d; animation: pop 0.4s ease; }
@keyframes pulse { 50% { transform: scale(1.06); } }
@keyframes pop { 0% { transform: scale(0.5); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

.question-card {
  background: white; border-radius: 22px; padding: 12px 14px; text-align: center;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}
.digits { font-size: 44px; font-weight: 900; color: #334155; letter-spacing: 1px; }
.words { font-size: 15px; font-weight: 700; color: #7c3aed; margin-top: 2px; min-height: 20px; }
.question-card.words-main .words { font-size: 26px; font-weight: 900; line-height: 1.25; margin: 4px 0; }
.q-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
.q-btn {
  border: none; background: #7c3aed; color: white; font-weight: 800; font-size: 16px;
  padding: 10px 16px; border-radius: 999px; cursor: pointer;
  box-shadow: 0 3px 8px rgba(124,58,237,0.3);
}
.q-btn:active { transform: scale(0.96); }
.q-btn.alt { background: #f59e0b; box-shadow: 0 3px 8px rgba(245,158,11,0.3); }
.q-btn[hidden] { display: none; }

.blocks {
  display: none; margin-top: 10px; padding: 10px; background: #faf5ff; border-radius: 16px;
  justify-content: center; align-items: flex-start; gap: 14px;
}
.blocks.open { display: flex; }
.blocks .plus { font-size: 28px; font-weight: 900; color: #7c3aed; align-self: center; }
.grp { display: flex; gap: 8px; align-items: flex-end; }
.sticks { display: flex; gap: 3px; align-items: flex-end; }
.stick {
  display: block; width: 11px; height: 44px; border-radius: 3px;
  background: repeating-linear-gradient(180deg, var(--c) 0 3.5px, rgba(255,255,255,0.7) 3.5px 4.5px);
}
.units { display: grid; grid-template-columns: repeat(3, 11px); gap: 3px; }
.unit { display: block; width: 11px; height: 11px; border-radius: 3px; background: var(--c); }
.grp.a { --c: #3b82f6; }
.grp.b { --c: #f97316; }

.msg { text-align: center; font-weight: 800; font-size: 17px; color: #4c1d95; min-height: 24px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  border: 3px solid #c4b5fd; background: white; border-radius: 20px; height: 84px;
  font-size: 40px; font-weight: 900; color: #334155; cursor: pointer;
  box-shadow: 0 5px 12px rgba(0,0,0,0.08);
  transition: transform 0.15s;
}
.tile:active { transform: scale(0.95); }
.tile.correct { border-color: #22c55e; background: #f0fdf4; color: #15803d; font-size: 52px; animation: pop 0.45s ease; }
.tile.off { opacity: 0.35; border-color: #fdba74; }
.tile.wobble { animation: wobble 0.45s ease; }
@keyframes wobble {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-9px) rotate(-3deg); }
  50% { transform: translateX(9px) rotate(3deg); }
  75% { transform: translateX(-5px); }
}
.next {
  display: none; border: none; background: #22c55e; color: white; font-weight: 900; font-size: 26px;
  padding: 20px; border-radius: 22px; cursor: pointer; box-shadow: 0 6px 14px rgba(34,197,94,0.35);
}
.next:active { transform: scale(0.97); }
.done .tiles { display: none; }
.done .next { display: block; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top-bar">
    <a class="nav-link" href="jeux-enfants.html">← Jeux</a>
    <div class="score" id="score">⭐ 0</div>
  </div>

  <div class="levels" id="levels">
    <button class="level on" data-level="1">1 · Facile</button>
    <button class="level" data-level="2">2 · Retenue</button>
    <button class="level" data-level="3">3 · English</button>
  </div>

  <div class="picture-card">
    <div class="picture" id="picture">🐱</div>
    <div class="slots" id="slots"></div>
  </div>

  <div class="question-card" id="qcard">
    <div class="digits" id="digits"></div>
    <div class="words" id="words"></div>
    <div class="q-buttons">
      <button class="q-btn" id="listen" aria-label="Écouter">🔊 Listen</button>
      <button class="q-btn alt" id="blocksBtn" aria-label="Blocs">🧱</button>
      <button class="q-btn alt" id="eyeBtn" aria-label="Voir les chiffres" hidden>👀</button>
    </div>
    <div class="blocks" id="blocks"></div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="tiles" id="tiles"></div>
  <button class="next" id="next">Mot suivant ➜</button>
</div>

<script>
const WORDS = {
  3: [['cat','🐱'],['dog','🐶'],['sun','☀️'],['hat','🎩'],['bus','🚌'],['pig','🐷'],
      ['cow','🐮'],['bee','🐝'],['car','🚗'],['egg','🥚'],['fox','🦊']],
  4: [['fish','🐟'],['bird','🐦'],['frog','🐸'],['star','⭐'],['moon','🌙'],['tree','🌳'],
      ['cake','🍰'],['book','📖'],['ball','⚽'],['duck','🦆'],['bear','🐻'],['milk','🥛'],
      ['hand','✋'],['shoe','👟'],['lion','🦁'],['boat','⛵'],['rain','🌧️']],
  5: [['apple','🍎'],['horse','🐴'],['mouse','🐭'],['snake','🐍'],['whale','🐳'],
      ['house','🏠'],['bread','🍞'],['clock','🕐'],['train','🚆'],['zebra','🦓']]
};
const POOLS = { 1: [3], 2: [3, 4], 3: [4, 5] };

const ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
  'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWords(n) {
  if (n < 20) return ONES[n];
  const t = TENS[Math.floor(n / 10)], u = n % 10;
  return u ? t + '-' + ONES[u] : t;
}

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rand(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

let level = 1, word = null, lastWord = '', slot = 0, q = null, wrong = 0, lock = false, stars = 0, showDigits = true;

// ---------- sound ----------
let ac = null;
function beep(freq, dur, type, delay) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sndOk = () => { beep(660, 0.12); beep(880, 0.18, 'sine', 0.1); };
const sndNo = () => beep(220, 0.2, 'triangle');
const sndWin = () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.2, 'sine', i * 0.12));

// ---------- speech ----------
let voice = null;
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === 'en-US') || vs.find(v => v.lang && v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = 0.85;
  speechSynthesis.speak(u);
}

// ---------- question generation ----------
function genQ() {
  const carry = level === 1 ? false : level === 2 ? true : Math.random() < 0.5;
  for (;;) {
    const a1 = rand(1, 8), b1 = rand(1, 8);
    let a0, b0;
    if (!carry) {
      if (a1 + b1 > 9) continue;
      a0 = rand(1, 8); b0 = rand(1, 9 - a0);
    } else {
      if (a1 + b1 > 8) continue;
      a0 = rand(2, 9); b0 = rand(10 - a0, 9);
    }
    const a = a1 * 10 + a0, b = b1 * 10 + b0;
    return { a, b, ans: a + b, carry };
  }
}
function makeChoices(ans, carry) {
  const ok = x => x >= 10 && x <= 99 && x !== ans;
  const first = carry && ok(ans - 10) ? [ans - 10] : [];   // classic mistake: forgetting the carry
  const rest = shuffle([ans + 10, ans - 10, ans + 1, ans - 1, ans + 2, ans - 2].filter(x => ok(x) && !first.includes(x)));
  return shuffle([ans, ...first, ...rest].slice(0, 4));
}

// ---------- rendering ----------
function blocksFor(n, cls) {
  const t = Math.floor(n / 10), u = n % 10;
  return '<div class="grp ' + cls + '"><div class="sticks">' + '<i class="stick"></i>'.repeat(t) +
    '</div><div class="units">' + '<i class="unit"></i>'.repeat(u) + '</div></div>';
}
function renderSlots() {
  $('slots').innerHTML = word[0].split('').map((ch, i) => {
    if (i < slot) return '<div class="slot filled">' + ch.toUpperCase() + '</div>';
    return '<div class="slot' + (i === slot ? ' active' : '') + '">?</div>';
  }).join('');
}
function renderQuestion() {
  const wa = numWords(q.a), wb = numWords(q.b);
  $('digits').textContent = showDigits ? q.a + ' + ' + q.b : '';
  $('digits').style.display = showDigits ? '' : 'none';
  $('qcard').classList.toggle('words-main', level === 3);
  $('words').innerHTML = level === 3 ? wa + '<br>+ ' + wb : wa + ' plus ' + wb;
  $('eyeBtn').hidden = !(level === 3 && !showDigits);
  $('blocks').classList.remove('open');
  $('blocks').innerHTML = blocksFor(q.a, 'a') + '<span class="plus">+</span>' + blocksFor(q.b, 'b');
  $('tiles').innerHTML = makeChoices(q.ans, q.carry)
    .map(n => '<button class="tile" data-n="' + n + '">' + n + '</button>').join('');
}
function say() { speak(numWords(q.a) + ' plus ' + numWords(q.b)); }

// ---------- game flow ----------
function newWord() {
  const pool = [];
  POOLS[level].forEach(len => WORDS[len].forEach(w => { if (w[0] !== lastWord) pool.push(w); }));
  word = pool[rand(0, pool.length - 1)];
  lastWord = word[0];
  slot = 0; lock = false;
  $('app').classList.remove('done');
  $('picture').textContent = word[1];
  $('msg').textContent = 'Résous l’addition pour trouver la lettre !';
  renderSlots();
  newQuestion();
}
function newQuestion() {
  q = genQ(); wrong = 0; showDigits = level < 3; lock = false;
  renderQuestion(); renderSlots();
  say();
}
function onTile(el) {
  if (lock || el.classList.contains('off') || el.classList.contains('correct')) return;
  const n = Number(el.dataset.n);
  if (n === q.ans) {
    lock = true;
    const letter = word[0][slot].toUpperCase();
    el.classList.add('correct'); el.textContent = letter;
    sndOk(); speak(numWords(q.ans));
    $('msg').textContent = q.ans + ' → ' + letter + ' !';
    setTimeout(() => {
      slot++;
      if (slot >= word[0].length) finish(); else newQuestion();
    }, 1100);
  } else {
    wrong++;
    el.classList.add('off', 'wobble');
    sndNo();
    $('msg').textContent = 'Essaie encore !';
    if (wrong >= 2) $('blocks').classList.add('open');
  }
}
function finish() {
  renderSlots();
  stars++; $('score').textContent = '⭐ ' + stars;
  $('app').classList.add('done');
  $('picture').classList.remove('bounce'); void $('picture').offsetWidth; $('picture').classList.add('bounce');
  $('msg').textContent = 'Bravo ! ' + word[0].toUpperCase();
  sndWin();
  setTimeout(() => speak(word[0] + '! ' + word[0].toUpperCase().split('').join('. ') + '.'), 500);
  lock = true;
}

// ---------- events ----------
$('tiles').addEventListener('click', e => {
  const el = e.target.closest ? e.target.closest('.tile') : null;
  if (el) onTile(el);
});
$('listen').addEventListener('click', () => { if (q) say(); });
$('blocksBtn').addEventListener('click', () => $('blocks').classList.toggle('open'));
$('eyeBtn').addEventListener('click', () => {
  showDigits = true;
  $('digits').textContent = q.a + ' + ' + q.b; $('digits').style.display = '';
  $('eyeBtn').hidden = true;
});
$('next').addEventListener('click', newWord);
$('levels').addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('.level') : null;
  if (!b) return;
  level = Number(b.dataset.level);
  document.querySelectorAll('.level').forEach(x => x.classList.toggle('on', x === b));
  newWord();
});

newWord();
</script>
</body>
</html>
