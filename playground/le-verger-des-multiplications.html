<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le verger des multiplications</title>

<style>
*{ box-sizing:border-box; }
body{
  margin:0;
  font-family:system-ui;
  min-height:100vh;
  background:linear-gradient(180deg, #dcfce7 0%, #86efac 100%);
  background-attachment:fixed;
  touch-action:manipulation;
}

/* Centres vertically when it fits, and simply scrolls when it does not —
   flex-centring the body instead would clip the overflow out of reach. */
.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:0 auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:12px;
}

.top{
  display:flex;
  justify-content:space-between;
  font-weight:900;
  font-size:16px;
  color:#14532d;
}

.card{
  background:white;
  border-radius:20px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.18);
}

.equation{
  text-align:center;
  font-size:30px;
  font-weight:900;
  letter-spacing:1px;
  min-height:42px;
  color:#14532d;
}

/* 7 columns: one guide gutter plus the 6 orchard columns. */
.orchard{
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  gap:4px;
  padding:10px;
  background:#f0fdf4;
  border:2px dashed #4ade80;
  border-radius:16px;
  transition:opacity 0.25s ease, transform 0.25s ease;
}

.orchard.hidden{ display:none; }
.orchard.poof{ opacity:0; transform:scale(0.85); }
.orchard.shake{ animation:shake 0.4s; }

/* Row/column numbers, so "3 rangées de 4" maps visibly onto a cell. */
.guide{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
  color:#86a893;
  border-radius:8px;
}

.guide.active{
  background:#bbf7d0;
  color:#14532d;
}

.cell{
  aspect-ratio:1;
  border:none;
  border-radius:8px;
  background:#e5e7eb;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  cursor:pointer;
  box-shadow:none;
  transition:background 0.15s ease, transform 0.15s ease;
}

.cell.on{
  background:radial-gradient(circle at 30% 30%, #bbf7d0, #4ade80);
}

.cell.shake{ animation:shake 0.4s; }

@keyframes shake{
  0%,100%{ transform:translateX(0); }
  25%{ transform:translateX(-5px); }
  75%{ transform:translateX(5px); }
}

.tally{
  text-align:center;
  font-size:26px;
  font-weight:900;
  color:#94a3b8;
  min-height:32px;
  transition:color 0.2s ease;
}

/* Turns green the moment the rectangle matches the goal. */
.tally.match{ color:#15803d; }

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid.hidden{ display:none; }

button{
  border:none;
  border-radius:14px;
  background:#222;
  color:white;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,0.16);
}

button:active{ transform:scale(0.96); }

.choice{
  min-height:60px;
  font-size:24px;
  background:#fff;
  color:#111;
  border:3px solid #15803d;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.control{ min-height:54px; font-size:18px; }

.ready{
  width:100%;
  min-height:56px;
  font-size:19px;
  background:#15803d;
}

.ready.hidden{ display:none; }

.good{ background:#16a34a !important; color:white !important; border-color:#16a34a !important; }
.bad{ background:#dc2626 !important; color:white !important; border-color:#dc2626 !important; }

.message{
  min-height:40px;
  text-align:center;
  font-size:16px;
  font-weight:800;
  color:#14532d;
}

@media (max-height:640px){
  .cell{ font-size:16px; }
  .equation{ font-size:24px; }
}
</style>
</head>

<body>
<div class="app">
  <div class="top">
    <div>🍎 <span id="hits">0</span></div>
    <div>⭐ Série: <span id="streak">0</span></div>
    <div>🌱 Niveau <span id="level">1</span></div>
  </div>

  <div class="card">
    <div class="equation" id="equation">?</div>

    <div class="orchard" id="orchard"></div>
    <div class="tally" id="tally"></div>

    <div class="grid" id="grid"></div>
    <div class="message" id="message">Appuie sur Jouer pour commencer !</div>

    <button class="control ready hidden" id="ready">C'est prêt !</button>

    <div class="controls">
      <button class="control" id="start">Jouer</button>
      <button class="control" id="repeat">🔊</button>
    </div>
  </div>
</div>

<script>
const ROWS = 6;
const COLS = 6;

let hits = 0;
let streak = 0;
let level = 1;
let round = null;
let lock = false;
let cells = [];
let rowGuides = [];
let colGuides = [];
let planted = { rows: 0, cols: 0 };
let voices = [];
let audioCtx = null;

const hitsEl = document.getElementById("hits");
const streakEl = document.getElementById("streak");
const levelEl = document.getElementById("level");
const equationEl = document.getElementById("equation");
const orchardEl = document.getElementById("orchard");
const tallyEl = document.getElementById("tally");
const gridEl = document.getElementById("grid");
const messageEl = document.getElementById("message");
const readyBtn = document.getElementById("ready");

function loadVoices(){ voices = speechSynthesis.getVoices(); }
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text){
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const frVoice = voices.find(v => v.lang.startsWith("fr"));
  if(frVoice) utter.voice = frVoice;
  utter.lang = "fr-FR";
  utter.rate = 0.9;
  speechSynthesis.speak(utter);
}

function shuffle(items){ return [...items].sort(() => Math.random() - 0.5); }
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

function getAudioContext(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(freqs, type, duration){
  try{
    const ctx = getAudioContext();
    if(ctx.state === "suspended") ctx.resume();
    freqs.forEach((f, i) => {
      setTimeout(() => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        const t = ctx.currentTime;
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + duration + 0.05);
      }, i * 90);
    });
  }catch(e){}
}

function sfxGood(){ playSound([523.25, 659.25, 783.99], "sine", 0.25); }
function sfxBad(){ playSound([200], "sawtooth", 0.3); }

// Build the orchard once, with a numbered gutter along the top and left edge.
// Cells and guides are kept in arrays so lookups never depend on DOM index math.
function buildOrchard(){
  orchardEl.innerHTML = "";
  cells = [];
  colGuides = [];
  rowGuides = [];

  const corner = document.createElement("div");
  corner.className = "guide";
  orchardEl.appendChild(corner);

  for(let c = 0; c < COLS; c++){
    const g = document.createElement("div");
    g.className = "guide";
    g.textContent = c + 1;
    colGuides.push(g);
    orchardEl.appendChild(g);
  }

  for(let r = 0; r < ROWS; r++){
    const g = document.createElement("div");
    g.className = "guide";
    g.textContent = r + 1;
    rowGuides.push(g);
    orchardEl.appendChild(g);

    cells[r] = [];
    for(let c = 0; c < COLS; c++){
      const cell = document.createElement("button");
      cell.className = "cell";
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.onclick = () => plant(r, c);
      cells[r][c] = cell;
      orchardEl.appendChild(cell);
    }
  }
}

function cellAt(r, c){ return cells[r][c]; }

// Fill the rectangle anchored at the top-left corner, rows x cols apples,
// and light up the matching guide numbers so the mapping is visible.
function paint(rows, cols){
  for(let r = 0; r < ROWS; r++){
    for(let c = 0; c < COLS; c++){
      const on = r < rows && c < cols;
      const cell = cellAt(r, c);
      cell.classList.toggle("on", on);
      cell.textContent = on ? "🍎" : "";
    }
  }
  rowGuides.forEach((g, i) => g.classList.toggle("active", i < rows));
  colGuides.forEach((g, i) => g.classList.toggle("active", i < cols));
  planted = { rows, cols };
}

function modeForLevel(lvl){
  if(lvl <= 2) return "build";
  if(lvl <= 4) return "read";
  return "recall";
}

function promptText(){
  if(round.mode === "build"){
    return `Plante ${round.a} rangées de ${round.b} pommes.`;
  }
  if(round.mode === "read"){
    return "Combien de pommes en tout ?";
  }
  return `Combien font ${round.a} fois ${round.b} ?`;
}

function buildChoices(answer, a, b){
  const wrong = new Set();
  // a+b is the classic mix-up between times and plus, so always offer it.
  if(a + b !== answer) wrong.add(a + b);
  const near = shuffle([answer + a, answer - a, answer + b, answer - b, answer + 1, answer - 1]);
  for(const v of near){
    if(wrong.size >= 3) break;
    if(v !== answer && v > 0) wrong.add(v);
  }
  while(wrong.size < 3){
    const v = randInt(2, answer + 8);
    if(v !== answer) wrong.add(v);
  }
  return shuffle([answer, ...[...wrong].slice(0, 3)]);
}

function newRound(){
  lock = false;
  level = Math.floor(hits / 4) + 1;
  levelEl.textContent = level;

  const mode = modeForLevel(level);
  const a = randInt(2, 6);
  const b = randInt(2, 6);
  const answer = a * b;

  round = { a, b, answer, mode, choices: mode === "build" ? [] : buildChoices(answer, a, b) };

  // In build mode the goal stays on screen, so the child compares rather than
  // remembers while they adjust the rectangle.
  equationEl.textContent = mode === "recall"
    ? `${a} × ${b} = ?`
    : mode === "build"
      ? `Objectif : ${a} × ${b}`
      : `${a} × ${b}`;

  readyBtn.classList.toggle("hidden", mode !== "build");

  tallyEl.textContent = "";
  tallyEl.classList.remove("match");

  if(mode === "build"){
    orchardEl.classList.remove("hidden");
    gridEl.classList.add("hidden");
    paint(0, 0);
    messageEl.textContent = "Touche une case, puis appuie sur C'est prêt !";
  } else if(mode === "read"){
    orchardEl.classList.remove("hidden");
    gridEl.classList.remove("hidden");
    paint(a, b);
    messageEl.textContent = "Compte les pommes, puis choisis le total.";
    renderChoices();
  } else {
    orchardEl.classList.add("hidden");
    gridEl.classList.remove("hidden");
    messageEl.textContent = "De mémoire cette fois !";
    renderChoices();
  }

  setTimeout(() => speak(promptText()), 300);
}

function renderChoices(){
  gridEl.innerHTML = "";
  round.choices.forEach(value => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = value;
    btn.onclick = () => choose(value, btn);
    gridEl.appendChild(btn);
  });
}

function succeed(extraMessage){
  lock = true;
  hits++;
  streak++;
  hitsEl.textContent = hits;
  streakEl.textContent = streak;
  sfxGood();

  const line = `${round.a} fois ${round.b} égale ${round.answer}.`;
  messageEl.textContent = `${extraMessage} ${line}`;
  speak(line);
  tallyEl.textContent = `${round.a} × ${round.b} = ${round.answer}`;
  tallyEl.classList.add("match");

  setTimeout(newRound, 1900);
}

function fail(message, spoken){
  streak = 0;
  streakEl.textContent = streak;
  sfxBad();
  messageEl.textContent = message;
  speak(spoken);
}

// Build mode: tapping a cell sets the rectangle's bottom-right corner. This is
// exploration only — nothing is judged until the child presses "C'est prêt !",
// so trying things out can never be wrong.
function plant(r, c){
  if(lock || !round || round.mode !== "build") return;

  const rows = r + 1;
  const cols = c + 1;
  paint(rows, cols);
  showTally();
  messageEl.textContent = "";
}

function rangees(n){
  return `${n} rangée${n > 1 ? "s" : ""}`;
}

function showTally(){
  const { rows, cols } = planted;
  if(rows === 0 || cols === 0){
    tallyEl.textContent = "";
    tallyEl.classList.remove("match");
    return;
  }
  tallyEl.textContent = `${rows} × ${cols} = ${rows * cols}`;
  tallyEl.classList.toggle("match", rows === round.a && cols === round.b);
}

// The single judged moment in build mode.
function submitPlanting(){
  if(lock || !round || round.mode !== "build") return;

  const { rows, cols } = planted;
  if(rows === 0 || cols === 0){
    messageEl.textContent = "Touche le verger pour planter des pommes.";
    return;
  }

  if(rows === round.a && cols === round.b){
    succeed("Bravo !");
  } else {
    orchardEl.classList.add("shake");
    setTimeout(() => orchardEl.classList.remove("shake"), 400);
    fail(
      `Tu as fait ${rangees(rows)} de ${cols}. Il faut ${rangees(round.a)} de ${round.b}.`,
      "Essaie encore."
    );
  }
}

function choose(value, btn){
  if(lock || !round) return;

  if(value === round.answer){
    btn.classList.add("good");
    Array.from(gridEl.children).forEach(b => b.disabled = true);
    succeed("Bravo !");
  } else {
    btn.classList.add("bad");
    fail("Oups ! Recompte les rangées.", "Oups, essaie encore.");
    setTimeout(() => btn.classList.remove("bad"), 450);
  }
}

document.getElementById("start").onclick = () => {
  getAudioContext().resume();
  speechSynthesis.resume();
  hits = 0;
  streak = 0;
  hitsEl.textContent = 0;
  streakEl.textContent = 0;
  newRound();
};

readyBtn.onclick = () => {
  getAudioContext().resume();
  speechSynthesis.resume();
  submitPlanting();
};

document.getElementById("repeat").onclick = () => {
  speechSynthesis.resume();
  if(round) speak(promptText());
};

buildOrchard();
paint(0, 0);
</script>
</body>
</html>
